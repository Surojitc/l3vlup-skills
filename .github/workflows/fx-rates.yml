name: Exchange rates (ECB)

# Reads the European Central Bank's euro reference rates and publishes
# data/fx.auto.json: the dated table l3vlup.com converts pay and career
# reference figures with (pounds and euros per US dollar). It replaces a table
# that was refreshed by hand. See lib/fx-rates.mjs for the rules.
#
# WHAT IT NEVER TOUCHES
# ---------------------
# Product prices stay in the currency they are billed in, and company models
# keep the currency they report in. The table is used for reference figures
# only, which are rounded to the nearest five thousand.
#
# CADENCE
# -------
# Weekly, Monday evening UTC: the ECB publishes about 16:00 CET on TARGET
# working days, so Monday's own rate is normally there; on a holiday the
# previous working day's rate is read, which the ten-day limit allows. A
# manual dispatch runs the same job.
#
# A BAD DAY CHANGES NOTHING
# -------------------------
# The script validates before it writes (both currencies, positive finite
# rates, a real date no later than today and no older than ten days, nothing
# older than the published date, no rate more than 20% from the published
# one). On any failure it writes nothing and exits non-zero, so this run goes
# red, nothing is staged or published, and the last valid file stays. The site
# keeps its own check of the same shape, its committed table as the fallback,
# and its 60-day rule that pauses conversion if the file is never refreshed.
#
# The source is public and free and needs no key, account or secret, so the
# collecting job holds no credential and a read-only token.

on:
  schedule:
    - cron: '17 17 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fx-rates
  cancel-in-progress: false

jobs:
  collect:
    name: Read the ECB rates and check them
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.stage.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20

      - name: Test the rules, the publication contract and the permissions
        run: |
          node scripts/__tests__/fx-rates.test.mjs
          node scripts/__tests__/publication-contracts.test.mjs
          node scripts/__tests__/workflow-permissions.test.mjs

      # Fails the run, and writes nothing, when the response is not fit.
      - name: Read the ECB reference rates
        run: node scripts/fx-rates.mjs

      - name: Stage the published file
        id: stage
        run: |
          set -euo pipefail
          git add -A data/fx.auto.json
          if git diff --cached --quiet; then
            echo "nothing changed; there is nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --cached --name-only > "$RUNNER_TEMP/staged.txt"
          sed 's/^/  /' "$RUNNER_TEMP/staged.txt"

      - name: Check what is about to be published
        if: steps.stage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node scripts/validate-data-publication.mjs \
            --producer fx-rates \
            --staged "$RUNNER_TEMP/staged.txt"

      - name: Pack what may be published
        if: steps.stage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handoff"
          tar -cf "$RUNNER_TEMP/handoff/publishable.tar" -T "$RUNNER_TEMP/staged.txt"

      - name: Upload what may be published
        if: steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: fx-rates-refresh
          path: ${{ runner.temp }}/handoff
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-data.yml
    with:
      producer: fx-rates
      artifact: fx-rates-refresh
      # One small file, validated twice (here and again by the publisher)
      # before it is committed, so it merges without waiting for a person.
      merge: true
