name: Collect open data

# This runs on a PUBLIC repo, where GitHub Actions minutes are unlimited and
# free. The L3VLUP site reads the JSON committed here via its DATA_BASE_URL.
#
# Every source is a public government feed, press wire or public careers page.
# One optional secret is used: FIRECRAWL_API_KEY renders the JS-heavy careers
# pages. It is optional by design — without it that step falls back to a plain
# fetch and simply misses the SPA-rendered firms — so a fork still runs this
# unchanged, and a fork's pull request never receives the secret anyway.
#
# Nothing here may ever move to pull_request_target. That is the one trigger
# that hands repository secrets to code from a fork, and on a public repo it is
# the difference between a scraper and a credential giveaway.

on:
  schedule:
    - cron: '0 6 * * *' # daily: calendar and deal tape
    - cron: '0 7 * * 1' # Mondays: the above plus the macro chartbook
    # First of the month: the above plus the precedent transactions database.
    # Monthly because that is how fast the underlying data moves. A merger
    # proxy is a quarterly-ish event, not a daily one, so reading for new ones
    # every morning would spend thousands of SEC requests to find nothing. The
    # first run of that collector against an empty database is several hours
    # and thousands of requests; every run after it reads one quarterly index
    # and a handful of requests per genuinely new filing, which is minutes.
    - cron: '0 8 1 * *'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Rebuild all 26 years of Treasury history (slow, ~9 min)'
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # For the monthly precedent transactions collector, which is Python and
      # standard library only. Pinned to the version build-samples.yml uses.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Economic calendar
        continue-on-error: true
        run: node scripts/sync-calendar.mjs

      - name: Deal tape
        continue-on-error: true
        run: node scripts/sync-deals.mjs

      # Cross-vertical newsflow for the site's news map (M&A, capital raises,
      # PE, VC, hedge funds). Same wires-and-RSS approach as the deal tape;
      # each feed is independently fault-tolerant. On the FIRST run, read this
      # step's log for FAILED lines — three of the feeds could not be probed
      # from the dev environment and this log is where a dead URL shows up.
      - name: Newsflow map
        continue-on-error: true
        run: node scripts/sync-newsflow.mjs

      # Diffs public graduate careers pages against the last snapshot. Both the
      # target list and the output are public web data, which is what makes this
      # safe to run — and to publish the results of — on a public repository.
      - name: Careers page diff
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/detect-career-changes.mjs

      # Weekly only, or whenever the workflow is run by hand.
      - name: Macro chartbook
        if: github.event.schedule != '0 6 * * *'
        continue-on-error: true
        env:
          FULL_HISTORY: ${{ inputs.full_history && '1' || '0' }}
        run: node scripts/sync-macro.mjs

      # Weekly, and it stays weekly. Adviser board books arrive a handful a
      # week, so a monthly pass would leave a new deck sitting unread for up to
      # a month; this is not part of the monthly block below and should not be
      # tidied into it. The first run reads every quarter since 2020 (about
      # twelve minutes, roughly 4,000 requests at the SEC's polite rate); after
      # that it reads one quarterly index and a handful of requests per new
      # filing or amendment.
      - name: Banker board books
        if: github.event.schedule != '0 6 * * *'
        continue-on-error: true
        env:
          SEC_USER_AGENT: 'L3VLUP Research (contact: suro@l3vlup.com)'
        run: node scripts/sync-decks.mjs

      # ── monthly: the precedent transactions database ──────────────────────
      #
      # Both steps write data/precedent-transactions.auto.json, which the site
      # reads for its precedent, premiums-paid and football-field pages. Each
      # refreshes only the rows it wrote, so they can run in either order; they
      # run after the board books above because the take-private step reads the
      # index that step has just refreshed.
      #
      # Every source is a public SEC endpoint. No key, no account, no secret,
      # which is what makes this safe on a public repository at all.
      #
      # The step timeout is deliberate: a first run against an empty database
      # is hours, and the collector writes what it has read every ten rows, so
      # stopping the step short still leaves the run able to commit its
      # progress. Being killed by the job timeout instead would throw it away.
      #
      # Both the database and the quarterly form index are committed already,
      # seeded from a local run, so the first scheduled run here is incremental
      # from the start. Without the index cache it would re-download 67
      # quarterly indexes, about a gigabyte, before finding nothing new.
      - name: Precedent transactions (take-privates)
        if: github.event.schedule == '0 8 1 * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 60
        env:
          SEC_USER_AGENT: 'L3VLUP Research (contact: suro@l3vlup.com)'
        run: python3 scripts/sync_precedent_transactions.py precedents

      - name: Precedent transactions (public mergers)
        if: github.event.schedule == '0 8 1 * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 180
        env:
          SEC_USER_AGENT: 'L3VLUP Research (contact: suro@l3vlup.com)'
        run: python3 scripts/sync_precedent_transactions.py mergers

      # Monthly with the transactions database, and for the same reason: a 13F
      # is quarterly, filed forty-five days after the quarter end, so the four
      # dates that matter are the middles of February, May, August and
      # November. Reading on the first of every month catches each of those
      # within a fortnight and spends nothing the rest of the year.
      #
      # The universe is a curated list of about ninety-five managers in
      # data/funds.universe.json, editable without touching code. The whole
      # 13F population is nearer nine thousand filers and is mostly index
      # sleeves, which is why --universe all exists and is not the default.
      - name: Hedge fund holdings
        if: github.event.schedule == '0 8 1 * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 90
        env:
          SEC_USER_AGENT: 'L3VLUP Research (contact: suro@l3vlup.com)'
        run: python3 scripts/sync_funds.py

      # Monthly, and monthly is the honest rate: who the SEC files under an
      # industry code changes when a company lists, deregisters or is
      # reclassified, which is a handful of names a month against roughly
      # eight thousand listed registrants.
      #
      # The comps lab reads data/peers.auto.json for the slow half of its peer
      # screen, which is industry membership, and keeps every price, market cap
      # and multiple live. So a file a few weeks old costs a reader a company
      # that listed since it was built, never a stale multiple, and a file that
      # is missing or unreadable costs nothing at all: the lab falls back to
      # asking EDGAR itself, exactly as it did before this existed.
      #
      # A full crawl is all 444 SIC codes the SEC publishes, which measured 877
      # requests: two for the code list and the ticker file, 875 pages of
      # company search. The collector caches per industry under .cache/peers,
      # which is not committed, so each scheduled run here re-reads every code
      # and the file is genuinely refreshed rather than carried forward. The
      # cache is what makes a local re-run, or a run resumed after a failure,
      # cheap.
      #
      # The timeout is set against the slow case. The seeding run took about an
      # hour end to end on a link where each SEC request cost roughly four
      # seconds; a runner talking to EDGAR directly should be several times
      # quicker. It matters because the file is written once at the end, so a
      # step killed early writes nothing at all.
      #
      # Public SEC endpoints only. No key, no account, no secret.
      - name: Industry peer lists
        if: github.event.schedule == '0 8 1 * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 90
        env:
          SEC_USER_AGENT: 'L3VLUP Research (contact: suro@l3vlup.com)'
        run: python3 scripts/sync_peers.py

      - name: Commit
        run: |
          git config user.name "l3vlup-bot"
          git config user.email "68951812+Surojitc@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore(data): scheduled collection"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main
            done
          fi

      # Daily social post — moved here from the private repo (2026-08-30),
      # whose metered Actions budget had silently stopped it. Runs LAST so it
      # posts against the data committed moments ago. Every channel is
      # optional: the script silently skips any channel whose secrets are
      # absent, so this step is a no-op until secrets are added. The tokens
      # are repository secrets — never exposed to forks or fork PRs, and this
      # workflow must never move to pull_request_target (see header).
      - name: Daily social post
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/daily-post.mjs
