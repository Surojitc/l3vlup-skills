name: Collect open data

# This runs on a PUBLIC repo, where GitHub Actions minutes are unlimited and
# free. The L3VLUP site reads the JSON committed here via its DATA_BASE_URL.
#
# Every source is a public government feed, press wire or public careers page.
# One optional secret is used: FIRECRAWL_API_KEY renders the JS-heavy careers
# pages. It is optional by design — without it that step falls back to a plain
# fetch and simply misses the SPA-rendered firms — so a fork still runs this
# unchanged, and a fork's pull request never receives the secret anyway.
#
# Nothing here may ever move to pull_request_target. That is the one trigger
# that hands repository secrets to code from a fork, and on a public repo it is
# the difference between a scraper and a credential giveaway.

on:
  schedule:
    - cron: '0 6 * * *' # daily: calendar and deal tape
    - cron: '0 7 * * 1' # Mondays: the above plus the macro chartbook
    # First of the month: the above plus the precedent transactions database.
    # Monthly because that is how fast the underlying data moves. A merger
    # proxy is a quarterly-ish event, not a daily one, so reading for new ones
    # every morning would spend thousands of SEC requests to find nothing. The
    # first run of that collector against an empty database is several hours
    # and thousands of requests; every run after it reads one quarterly index
    # and a handful of requests per genuinely new filing, which is minutes.
    - cron: '0 8 1 * *'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Rebuild all 26 years of Treasury history (slow, ~9 min)'
        type: boolean
        default: false

# The floor every job here inherits, stated rather than left to a repository
# setting no one reads. A job that says nothing about permissions gets
# nothing; the one below says what it needs and gets only that.
permissions:
  contents: read

jobs:
  # Everything that touches the outside world, with a token that can only
  # read. It fetches government feeds, press wires, SEC endpoints and a
  # hundred and sixty careers pages; whatever any of them returns, this job
  # cannot push a branch, open a pull request or merge one.
  collect:
    name: Collect and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      blocking: ${{ steps.freshness.outputs.blocking }}
      degraded: ${{ steps.freshness.outputs.degraded }}
      changed: ${{ steps.stage.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
      # For the monthly precedent transactions collector, which is Python and
      # standard library only. Pinned to the version build-samples.yml uses.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      # When this collection began, so the freshness sweep can tell a file a
      # collector wrote this morning from one it was due to write and did not.
      - name: Note when the collection began
        id: began
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The gate that decides what this run may publish, checked before the
      # run spends an hour collecting something it would then refuse.
      - name: Test the publication contract
        run: |
          node scripts/__tests__/publication-contracts.test.mjs
          node scripts/__tests__/publication-freshness.test.mjs
          node scripts/__tests__/workflow-permissions.test.mjs
          python3 scripts/__tests__/sync-peers.test.py

      - name: Economic calendar
        continue-on-error: true
        run: node scripts/sync-calendar.mjs

      - name: Deal tape
        continue-on-error: true
        run: node scripts/sync-deals.mjs

      # Cross-vertical newsflow for the site's news map (M&A, capital raises,
      # PE, VC, hedge funds). Same wires-and-RSS approach as the deal tape;
      # each feed is independently fault-tolerant. On the FIRST run, read this
      # step's log for FAILED lines — three of the feeds could not be probed
      # from the dev environment and this log is where a dead URL shows up.
      - name: Newsflow map
        continue-on-error: true
        run: node scripts/sync-newsflow.mjs

      # Diffs public graduate careers pages against the last snapshot. Both the
      # target list and the output are public web data, which is what makes this
      # safe to run — and to publish the results of — on a public repository.
      - name: Careers page diff
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/detect-career-changes.mjs

      # Weekly only, or whenever the workflow is run by hand.
      - name: Macro chartbook
        if: github.event.schedule != '0 6 * * *'
        continue-on-error: true
        env:
          FULL_HISTORY: ${{ inputs.full_history && '1' || '0' }}
        run: node scripts/sync-macro.mjs

      # Weekly, and it stays weekly. Adviser board books arrive a handful a
      # week, so a monthly pass would leave a new deck sitting unread for up to
      # a month; this is not part of the monthly block below and should not be
      # tidied into it. The first run reads every quarter since 2020 (about
      # twelve minutes, roughly 4,000 requests at the SEC's polite rate); after
      # that it reads one quarterly index and a handful of requests per new
      # filing or amendment.
      - name: Banker board books
        if: github.event.schedule != '0 6 * * *'
        continue-on-error: true
        env:
          SEC_USER_AGENT: 'L3VLUP Research (contact: suro@l3vlup.com)'
        run: node scripts/sync-decks.mjs

      # ── monthly: the precedent transactions database ──────────────────────
      #
      # Both steps write data/precedent-transactions.auto.json, which the site
      # reads for its precedent, premiums-paid and football-field pages. Each
      # refreshes only the rows it wrote, so they can run in either order; they
      # run after the board books above because the take-private step reads the
      # index that step has just refreshed.
      #
      # Every source is a public SEC endpoint. No key, no account, no secret,
      # which is what makes this safe on a public repository at all.
      #
      # The step timeout is deliberate: a first run against an empty database
      # is hours, and the collector writes what it has read every ten rows, so
      # stopping the step short still leaves the run able to commit its
      # progress. Being killed by the job timeout instead would throw it away.
      #
      # Both the database and the quarterly form index are committed already,
      # seeded from a local run, so the first scheduled run here is incremental
      # from the start. Without the index cache it would re-download 67
      # quarterly indexes, about a gigabyte, before finding nothing new.
      - name: Precedent transactions (take-privates)
        if: github.event.schedule == '0 8 1 * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 60
        env:
          SEC_USER_AGENT: 'L3VLUP Research (contact: suro@l3vlup.com)'
        run: python3 scripts/sync_precedent_transactions.py precedents

      - name: Precedent transactions (public mergers)
        if: github.event.schedule == '0 8 1 * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 180
        env:
          SEC_USER_AGENT: 'L3VLUP Research (contact: suro@l3vlup.com)'
        run: python3 scripts/sync_precedent_transactions.py mergers

      # The CUSIP-to-ticker map the holdings pages are read through, and the
      # reason it exists: a 13F information table names a security by CUSIP and
      # by whatever the filer typed in the issuer column, never by ticker, and
      # an ETF is filed under the trust that issues it. So eleven different
      # Select Sector funds arrive as eleven identical lines and forty-four per
      # cent of all holdings resolved to no ticker at all, every dual-class
      # company and every fund among them.
      #
      # The SEC's fails-to-deliver files are the map. Published twice a month
      # under FOIA, each row carries CUSIP, symbol and description side by side.
      # The fails themselves are irrelevant here; that pair is the only free
      # CUSIP-to-ticker link the regulator publishes, and twelve files of it
      # cover 97.8% of the rows that had nothing.
      #
      # Runs before the holdings collector so a quarter that lands this morning
      # is read against a map refreshed the same morning. Monthly is ample: a
      # mapping moves when a ticker changes, and a stale map is still a correct
      # one. Reads sec.gov and nothing else, and needs no secret.
      - name: CUSIP to ticker map
        if: github.event.schedule == '0 8 1 * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/sync-cusip-tickers.mjs

      # Monthly with the transactions database, and for the same reason: a 13F
      # is quarterly, filed forty-five days after the quarter end, so the four
      # dates that matter are the middles of February, May, August and
      # November. Reading on the first of every month catches each of those
      # within a fortnight and spends nothing the rest of the year.
      #
      # The universe is a curated list of about ninety-five managers in
      # data/funds.universe.json, editable without touching code. The whole
      # 13F population is nearer nine thousand filers and is mostly index
      # sleeves, which is why --universe all exists and is not the default.
      - name: Hedge fund holdings
        if: github.event.schedule == '0 8 1 * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 90
        env:
          SEC_USER_AGENT: 'L3VLUP Research (contact: suro@l3vlup.com)'
        run: python3 scripts/sync_funds.py

      # Monthly, and monthly is the honest rate: who the SEC files under an
      # industry code changes when a company lists, deregisters or is
      # reclassified, which is a handful of names a month against roughly
      # eight thousand listed registrants.
      #
      # The comps lab reads data/peers.auto.json for the slow half of its peer
      # screen, which is industry membership, and keeps every price, market cap
      # and multiple live. So a file a few weeks old costs a reader a company
      # that listed since it was built, never a stale multiple, and a file that
      # is missing or unreadable costs nothing at all: the lab falls back to
      # asking EDGAR itself, exactly as it did before this existed.
      #
      # A full crawl is all 444 SIC codes the SEC publishes, about 880 pages of
      # company search, and that page is EDGAR's legacy CGI endpoint: from a
      # runner it cost seven and a half seconds a page whatever the pace. So a
      # cold crawl is an hour and fifty minutes, and when every run was cold,
      # because the cache lived under an uncommitted .cache/peers, run #42 on
      # 24 September was killed at ninety minutes with 353 codes read and no
      # file written. It showed green because of continue-on-error.
      #
      # Now the collector keeps what each industry's crawl found in
      # data/peers-crawl.auto.json, published with the output, and stops
      # crawling at --budget-minutes. It reads the industries it has never
      # seen, then the ones read longest ago, and writes a complete file every
      # run from what it read plus what the record already held. Sixty minutes
      # is roughly 480 pages, so every industry is re-read at least every
      # second month, and the tickers are re-joined from a fresh ticker file
      # every run. The thirty minutes between budget and timeout cover the
      # one page the budget can overrun by, with its retries, and the join.
      #
      # If it does still fail, the freshness sweep below is told it was due,
      # and marks the peer lists degraded on the morning it happened.
      #
      # Public SEC endpoints only. No key, no account, no secret.
      - name: Industry peer lists
        id: peers
        if: github.event.schedule == '0 8 1 * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 90
        env:
          SEC_USER_AGENT: 'L3VLUP Research (contact: suro@l3vlup.com)'
        run: python3 scripts/sync_peers.py --budget-minutes 60

      # ── freshness ──────────────────────────────────────────────────────
      # Every source this producer owns, whether or not this run touched it.
      # The gate below checks what is being published; a collector that fails
      # every morning publishes nothing, so the gate has nothing to object to
      # while the committed file ages behind a green tick. That is how two
      # days of calendar, deal tape and news map went stale under a run that
      # reported success.
      #
      # It never fails here. Publication of the healthy sources goes ahead
      # first, and the `health` job at the end turns a stale required source
      # into a failed run, so the data still flows and the morning is still
      # visibly not fine.
      #
      # A monthly collector that was due this run is named with --expect, so a
      # step that timed out behind continue-on-error reads as degraded today
      # rather than as not-due until its forty-five-day horizon. Only the peer
      # lists are named so far, being the one that has done it.
      - name: Check how fresh every source is
        id: freshness
        env:
          BEGAN: ${{ steps.began.outputs.at }}
          PEERS: ${{ steps.peers.outcome }}
        run: |
          set -euo pipefail
          expect=()
          if [ -n "${PEERS:-}" ] && [ "$PEERS" != "skipped" ]; then
            expect+=(--since "$BEGAN" --expect data/peers.auto.json)
          fi
          node scripts/check-freshness.mjs \
            --producer open-data \
            --summary "$GITHUB_STEP_SUMMARY" \
            --output "$GITHUB_OUTPUT" \
            "${expect[@]}"

      # ── publication ────────────────────────────────────────────────────
      # This used to be a commit and a push, inside a three-attempt retry
      # loop. The ruleset of 18 September refused the push and the loop's exit
      # status was whatever `git pull --rebase` returned, so the step passed,
      # the job passed, and the run reported success for two days while the
      # calendar, the deal tape and the news map went stale behind a green
      # tick. Nothing below can do that: every failure path exits non-zero.
      #
      # `git add -A` rather than `git add data/`, which is the other half of
      # the same lesson. Staging one directory means a run that has edited a
      # script leaves that change uncommitted and unmentioned; staging
      # everything and refusing anything outside the allowlist means it fails
      # loudly instead.
      - name: Stage the collection
        id: stage
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "the collection changed nothing; there is nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --cached --name-only > "$RUNNER_TEMP/staged.txt"
          echo "staged:"
          sed 's/^/  /' "$RUNNER_TEMP/staged.txt"

      - name: Check what is about to be published
        if: steps.stage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node scripts/validate-data-publication.mjs \
            --producer open-data \
            --staged "$RUNNER_TEMP/staged.txt"

      # Generated data and nothing else.
      #
      # This step was written before the publisher was corrected, and copied
      # the gate and the contract table in beside the archive. That handed
      # the judge to the party being judged. The publisher now reads both
      # from its own checkout of `main` and writes the pull request body
      # there, so nothing this job produced decides whether this job's output
      # may be published.
      - name: Pack what may be published
        if: steps.stage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handoff"
          tar -cf "$RUNNER_TEMP/handoff/publishable.tar" -T "$RUNNER_TEMP/staged.txt"
          echo "the handoff holds:"
          find "$RUNNER_TEMP/handoff" -type f -printf '  %P\n'

      - name: Upload what may be published
        if: steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: open-data-refresh
          path: ${{ runner.temp }}/handoff
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    # Granted here, on the one job that says `uses:`, so a reviewer of this
    # file sees what the publisher is being trusted with. The publisher
    # cannot widen it; a called workflow may only narrow what it inherits.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-data.yml
    with:
      producer: open-data
      artifact: open-data-refresh
      # Open the data pull request and stop, on the schedule and by hand
      # alike. Not an input with a default: an input is a thing somebody can
      # get wrong at four in the morning, and the point of this stage is that
      # the automation is *structurally* incapable of merging until it has
      # shown both halves of the road work.
      #
      # WHAT WOULD JUSTIFY `true`
      # -------------------------
      # Two runs, in this order:
      #
      #   1. A run that opens the data pull request, whose diff carries only
      #      this producer's files and which a human reads and merges.
      #   2. A second run proving the same branch and the same pull request
      #      are updated rather than duplicated.
      #
      # Then a separate, narrow pull request changes this one line and says
      # which two run ids proved it. Not bundled into anything else: the
      # whole value of the two proofs is that nothing else moved between
      # them and the change they justify.
      merge: false

  # Downstream notification, and only once the data is actually on main. The
  # post reads the calendar, the deal tape and the chartbook, so announcing a
  # collection that failed to publish would be announcing yesterday's.
  notify:
    name: Daily social post
    needs: publish
    if: needs.publish.outputs.merged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
      # Every channel is optional: the script silently skips any channel whose
      # secrets are absent, so this is a no-op until secrets are added. The
      # tokens are repository secrets, never exposed to forks or fork pull
      # requests, and this workflow must never move to pull_request_target
      # (see the header).
      - name: Daily social post
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/daily-post.mjs

  # The run's conclusion, set after publication rather than before it.
  #
  # Splitting these apart is the point: a stale calendar must not stop a
  # healthy deal tape reaching the site, and a morning where a collector has
  # been dead for two days must not report success. So publication happens,
  # and then this fails the run and says which source and since when.
  #
  # `if: always()` because the interesting case is the one where publishing
  # was skipped or failed: a health report that only runs on the happy path
  # is the defect it was written to catch.
  health:
    name: Source health
    needs: [collect, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Three outcomes, and the first of them is the one this job used to get
      # wrong. `blocking` and `degraded` arrive from a step in the collecting
      # job; if that job died before reaching it, both are empty strings, and
      # empty is not false. The old wording read them as an all-clear and
      # printed "every required source is within its horizon" over a
      # collection that never happened. The run was still red, because the
      # collecting job had failed, but an operator reading the conclusion was
      # told the opposite of the truth about freshness.
      #
      # An absent answer is not a good answer. Say which of the three
      # situations this is, and never claim the third without the evidence
      # for it.
      - name: Say what this morning actually was
        env:
          COLLECT: ${{ needs.collect.result }}
          PUBLISH: ${{ needs.publish.result }}
          BLOCKING: ${{ needs.collect.outputs.blocking }}
          DEGRADED: ${{ needs.collect.outputs.degraded }}
        run: |
          set -euo pipefail

          # 1. The collection or the publication did not finish. Freshness
          #    cannot be established either way, and saying so is the whole
          #    job: `skipped` on publish is the legitimate case where the
          #    collection changed nothing.
          if [ "${COLLECT:-}" != "success" ]; then
            echo "::error::the collection did not finish (${COLLECT:-unknown}); freshness could not establish an all-clear, and nothing was published"
            exit 1
          fi
          if [ "${PUBLISH:-}" != "success" ] && [ "${PUBLISH:-}" != "skipped" ]; then
            echo "::error::the collection finished but publication did not (${PUBLISH:-unknown}); freshness could not establish an all-clear for what reached main"
            exit 1
          fi

          # 2. The collection finished and a required source is stale.
          if [ "${BLOCKING:-}" = "true" ]; then
            echo "::error::the collection finished, and a required source has not been collected inside its horizon; see the freshness table in this run's summary"
            exit 1
          fi

          # A verdict the sweep never wrote is not a verdict. If the
          # collecting job succeeded, both of these are set.
          if [ -z "${BLOCKING:-}" ]; then
            echo "::error::the collection reported success but wrote no freshness verdict; freshness could not establish an all-clear"
            exit 1
          fi

          # 3. The collection finished and every required source is fresh.
          if [ "${DEGRADED:-}" = "true" ]; then
            echo "::warning::an optional source is degraded; publication went ahead"
          fi
          echo "the collection finished and every required source is within its horizon"
