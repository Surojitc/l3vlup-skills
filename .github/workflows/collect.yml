name: Collect open data

# This runs on a PUBLIC repo, where GitHub Actions minutes are unlimited and
# free. The L3VLUP site reads the JSON committed here via its DATA_BASE_URL.
#
# Every source is a public government feed, press wire or public careers page.
# One optional secret is used: FIRECRAWL_API_KEY renders the JS-heavy careers
# pages. It is optional by design — without it that step falls back to a plain
# fetch and simply misses the SPA-rendered firms — so a fork still runs this
# unchanged, and a fork's pull request never receives the secret anyway.
#
# Nothing here may ever move to pull_request_target. That is the one trigger
# that hands repository secrets to code from a fork, and on a public repo it is
# the difference between a scraper and a credential giveaway.

on:
  schedule:
    - cron: '0 6 * * *' # daily: calendar and deal tape
    - cron: '0 7 * * 1' # Mondays: the above plus the macro chartbook
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Rebuild all 26 years of Treasury history (slow, ~9 min)'
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Economic calendar
        continue-on-error: true
        run: node scripts/sync-calendar.mjs

      - name: Deal tape
        continue-on-error: true
        run: node scripts/sync-deals.mjs

      # Diffs public graduate careers pages against the last snapshot. Both the
      # target list and the output are public web data, which is what makes this
      # safe to run — and to publish the results of — on a public repository.
      - name: Careers page diff
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/detect-career-changes.mjs

      # Weekly only, or whenever the workflow is run by hand.
      - name: Macro chartbook
        if: github.event.schedule != '0 6 * * *'
        continue-on-error: true
        env:
          FULL_HISTORY: ${{ inputs.full_history && '1' || '0' }}
        run: node scripts/sync-macro.mjs

      - name: Commit
        run: |
          git config user.name "l3vlup-bot"
          git config user.email "68951812+Surojitc@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore(data): scheduled collection"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main
            done
          fi
