name: Letters — parse the approved documents

# Manual only. There is no schedule and there will not be one until the
# pipeline has been run by hand enough times to be boring.
#
# The job that touches sec.gov cannot write anything, and the job that can
# write never touches sec.gov. That split is the whole design: parsing reads
# nine public filings and produces two metadata files, and a second job
# validates those files against the allowlist and opens a pull request for a
# person to read. Nothing is pushed to a branch anyone deploys from.
#
# What this workflow never does: fetch a document the approved selection does
# not name, upload an original or any extracted text, call a model, read a
# model key, run optical character recognition, touch Supabase or Vercel, or
# change the site. It needs no secret beyond the token GitHub issues for the
# run itself.
#
# Defaults are the safe ones. Run it with nothing changed and it plans the
# work, fetches nothing and opens nothing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan and check only; fetch nothing'
        type: boolean
        required: false
        default: true
      open_pull_request:
        description: 'Open a pull request if the parsed output changed'
        type: boolean
        required: false
        default: false

# One run at a time. A second run parsing the same nine documents while the
# first is mid-flight would double the requests to sec.gov for no result, so
# a queued run waits rather than cancelling: the one already talking to the
# SEC should be allowed to finish and clean up after itself.
concurrency:
  group: letters-parse
  cancel-in-progress: false

# Read-only by default. The one job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  parse:
    name: Parse (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publication_changed: ${{ steps.diff.outputs.publication_changed }}
    steps:
      # A dry run fetches nothing, so there is no output to open anything
      # about. Asking for both is a contradiction, and the honest answer is
      # to fail rather than to run half of what was asked and skip the rest
      # silently — someone who ticked both boxes is owed the correction.
      - name: Refuse a contradictory request
        if: ${{ inputs.dry_run && inputs.open_pull_request }}
        run: |
          echo "::error::dry_run and open_pull_request cannot both be true: a dry run produces no output to open a pull request about. Re-run with dry_run=false to parse and open one, or open_pull_request=false to plan only."
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # --omit=optional leaves out @napi-rs/canvas, which pdfjs-dist declares
      # for rendering pages to images. Nothing here renders anything, and
      # every test passes without it, so 34 MB of prebuilt native binary stays
      # out of the tree.
      - name: Install
        run: npm ci --omit=optional

      - name: Tests
        run: |
          npm run test:letters
          npm run test:select
          npm run test:retrieval

      # The nine is enforced in the script, which is the only place that can
      # enforce it. This is the check that the script still says nine, so a
      # quiet edit widening the run shows up before any request is made.
      - name: Confirm the approved set is still nine
        run: |
          count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/letters.selection.json','utf8')).selection.length)")
          echo "approved documents: $count"
          if [ "$count" -gt 9 ]; then
            echo "::error::the selection holds $count documents, over the nine approved for Phase 0"
            exit 1
          fi
          grep -q 'MAX_DOCUMENTS = 9' scripts/retrieve-letters.mjs || {
            echo "::error::the nine-document ceiling is no longer in scripts/retrieve-letters.mjs"; exit 1; }
          grep -q 'MAX_REQUESTS = 9' scripts/retrieve-letters.mjs || {
            echo "::error::the nine-request ceiling is no longer in scripts/retrieve-letters.mjs"; exit 1; }

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: node scripts/retrieve-letters.mjs --dry-run

      # ephemeral-sec is the default and needs no archive: the workspace is
      # made by mkdtemp and deleted before the step ends, and the runner's
      # disk is discarded afterwards either way.
      - name: Retrieve and parse
        if: ${{ !inputs.dry_run }}
        env:
          # The SEC asks every automated reader to identify itself and give a
          # contact address. The fallback is a real one, so the run is
          # identified whether or not the repository variable is set; the
          # same expression build-samples.yml uses. It is a variable, never a
          # secret: there is nothing here to keep private.
          SEC_USER_AGENT: "${{ vars.SEC_USER_AGENT || 'L3VLUP Research (contact: suro@l3vlup.com)' }}"
          # Routine request detail goes here, is rendered into the job
          # summary, rides the one-day artifact, and dies with the runner.
          LETTERS_RUN_LOG: ${{ runner.temp }}/letters-requests.run.jsonl
        run: node scripts/retrieve-letters.mjs --mode ephemeral-sec

      - name: Validate the output against the allowlist
        if: ${{ !inputs.dry_run }}
        run: node scripts/letters-validate-output.mjs

      # Only the two publication files decide this.
      #
      # data/letters.requests.jsonl is deliberately absent. It grows on every
      # real run by design, so including it meant every run looked like a
      # change and the write-enabled job started for no reason — the same
      # noise the deterministic output was built to remove, one level up.
      # Under the ledger policy a routine attempt no longer reaches that file
      # at all, and a material event that does always moves the published
      # output too, so it is never the sole reason to open anything.
      - name: Did the published output change
        id: diff
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- data/letters.parsed.json data/letters.parsed.md; then
            echo "publication_changed=false" >> "$GITHUB_OUTPUT"
            echo "the published output is unchanged; nothing to open"
            git --no-pager diff --stat -- data/ || true
          else
            echo "publication_changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- data/letters.parsed.json data/letters.parsed.md
          fi

      # Three metadata files and nothing else. The upload is named file by
      # file rather than by directory so an original or a text dump cannot be
      # swept in by a wildcard; the step before it fails the run if anything
      # unexpected is in the workspace.
      - name: Check nothing else is staged for upload
        if: ${{ !inputs.dry_run && steps.diff.outputs.publication_changed == 'true' }}
        run: |
          unexpected=$(git status --porcelain -- data/ | grep -v -E 'letters[.](parsed[.](json|md)|requests[.]jsonl)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::the run left files that are not the parsed metadata:"
            echo "$unexpected"
            exit 1
          fi

      # Runs whatever happened above: a clean finish, a refused fetch, a
      # parser that threw, a cancellation, a step that failed. The script
      # deletes its own workspace from a finally block and from its signal
      # handlers, and this is the independent check that it did — it looks
      # where the workspace is made (mkdtemp under the runner's temp
      # directory, prefix letters-run-) and for any document or text dump
      # that landed in the checkout. It fails the run rather than reporting
      # quietly, because a leftover original is the one outcome this whole
      # design exists to prevent.
      - name: Confirm nothing was left behind
        if: always()
        run: |
          status=0
          leftover_dirs=$(find "${RUNNER_TEMP:-/tmp}" /tmp -maxdepth 1 -name 'letters-run-*' 2>/dev/null | sort -u)
          if [ -n "$leftover_dirs" ]; then
            echo "::error::a run workspace survived the run:"
            echo "$leftover_dirs"
            for d in $leftover_dirs; do find "$d" -type f | head -50; done
            status=1
          else
            echo "ok: no letters-run-* workspace remains"
          fi
          # Asked of git rather than of mtimes: git knows exactly what the
          # checkout contained, so a document the run wrote shows up as
          # untracked or modified with no race against the checkout's own
          # timestamps. node_modules is gitignored, so npm's own files are
          # never mistaken for a leftover.
          stray=$(git status --porcelain --untracked-files=all 2>/dev/null | awk '{print $NF}' | grep -Ei '[.](pdf|html?|txt|xml)$' || true)
          if [ -n "$stray" ]; then
            echo "::error::the run left document or text files in the checkout:"
            echo "$stray"
            status=1
          else
            echo "ok: no document or extracted-text file in the checkout"
          fi
          exit $status

      - name: Upload the parsed metadata
        if: ${{ !inputs.dry_run && steps.diff.outputs.publication_changed == 'true' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: letters-parsed-metadata
          path: |
            data/letters.parsed.json
            data/letters.parsed.md
            data/letters.requests.jsonl
            ${{ runner.temp }}/letters-requests.run.jsonl
          if-no-files-found: error
          retention-days: 1

  open-pull-request:
    name: Validate and open a pull request
    needs: parse
    if: ${{ !inputs.dry_run && inputs.open_pull_request && needs.parse.outputs.publication_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The least that can open a pull request: a branch to push and the pull
    # request itself. No packages, no actions, no deployments, no id-token.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install
        run: npm ci --omit=optional

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: letters-parsed-metadata
          path: data

      # The artifact was built from three named files, but this job should
      # not take that on trust from a job it did not watch. If anything else
      # arrived, the download is not what it claims to be and nothing below
      # should run.
      - name: Confirm only the three metadata files arrived
        run: |
          arrived=$(git status --porcelain -- data/ | awk '{print $NF}' | sort)
          expected=$(printf '%s\n' data/letters.parsed.json data/letters.parsed.md data/letters.requests.jsonl | sort)
          extra=$(comm -23 <(echo "$arrived") <(echo "$expected"))
          if [ -n "$extra" ]; then
            echo "::error::the artifact carried files that are not the three metadata files:"
            echo "$extra"
            exit 1
          fi
          echo "ok: only the three metadata files arrived"

      # The parsing job already refused to write an unpublishable record, but
      # this job did not watch it do so. It re-reads the files it is about to
      # commit, knowing nothing about how they were made: every record inside
      # the allowlist, every document one the approved selection names, no
      # more than nine, no run data, and the two files agreeing with each
      # other. Nothing is committed until this passes.
      - name: Validate what arrived
        run: node scripts/letters-validate-output.mjs

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/; then
            echo "nothing changed after all; not opening a pull request"
            exit 0
          fi
          # run_id is unique for the life of the repository and run_attempt
          # distinguishes a re-run of the same one, so this cannot collide
          # with a concurrent run, a re-run, or a branch an earlier run left
          # behind. The date is there only so a human can read the list.
          branch="letters/parsed-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::$branch already exists on the remote; refusing to push over it"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          # Named files only, and never anything under .github. The token
          # this job holds has no workflows scope, so GitHub would refuse a
          # push touching a workflow anyway; this makes the intent explicit
          # rather than relying on the platform to catch it.
          git add data/letters.parsed.json data/letters.parsed.md data/letters.requests.jsonl
          if ! git diff --cached --quiet -- ':(glob).github/**' ':(glob)*.yml' ':(glob)*.yaml'; then
            echo "::error::the staged change touches a workflow or configuration file; refusing"
            exit 1
          fi
          git commit -m 'Letters: refresh the parsed metadata for the approved documents'
          git push origin "$branch"
          printf '%s\n' \
            'Opened by the manual **Letters — parse** workflow. Metadata only: the' \
            'documents stay on sec.gov and nothing was retained by the run.' \
            '' \
            'Both files are validated against the public allowlist before this branch' \
            'is pushed, so a diff here means a document genuinely changed on sec.gov —' \
            'an amended filing, a different parser result — and not that a run' \
            'happened. Read the diff for what moved and why.' \
            '' \
            '---' \
            '_Generated by [Claude Code](https://claude.ai/code)_' > /tmp/letters-pr-body.md
          gh pr create \
            --base main \
            --head "$branch" \
            --title 'Letters: refresh the parsed metadata' \
            --body-file /tmp/letters-pr-body.md
