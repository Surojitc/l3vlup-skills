name: Thesis pilot — extract claims from approved documents

# Manual only, and the only workflow in this repository that spends money.
#
# The shape is the same one the parsing workflow settled into, because the
# reasoning is the same: the job that reads documents and calls a model holds
# no write token, and the job that can write never reads a document or calls a
# model. What is new is the key, so the rules around it are tighter.
#
# There is no API key. The extraction job asks GitHub for a short-lived OIDC
# identity token and exchanges it, through the SDK, for an Anthropic access
# token that lives 30 minutes and is scoped to inference in one workspace.
# Nothing long-lived is stored in this repository, so there is no secret to
# leak, rotate or revoke.
#
# Only the extraction job carries `id-token: write`. GitHub exposes the token
# request endpoint solely to jobs that hold that permission, so the job that
# can open a pull request cannot ask for an identity token at all: it is not a
# rule it is asked to follow, it is a capability it does not have.
#
# Inputs are fixed dropdowns. Not because a free-text field would be
# inconvenient, but because a free-text input interpolated by the runner into
# the text of a shell script is the classic Actions injection, and the way to
# be sure it cannot happen is to have no free text and no interpolation. Every
# input reaches the script as an environment variable and is validated again
# in JavaScript against the approved selection.
#
# What leaves the runner is one artefact: the sanitised feed, the review
# markdown and the cost. No source document, no extracted text, no prompt, no
# model response. lib/thesis-publish.mjs decides that by allowlist and the
# pull-request job checks it again before committing anything.

on:
  workflow_dispatch:
    inputs:
      document_set:
        description: 'Which approved documents to read'
        type: choice
        required: true
        default: 'pilot-two'
        options:
          - pilot-two
          - starboard-value-2026-03-11
          - southeastern-2026-09-04
      model:
        description: 'Model (a fixed list; the run refuses anything not on it)'
        type: choice
        required: true
        default: 'claude-haiku-4-5-20251001'
        options:
          - claude-haiku-4-5-20251001
          - claude-sonnet-5
      budget_usd:
        description: 'Ceiling for this run, in dollars'
        type: choice
        required: true
        default: '3'
        options:
          - '1'
          - '3'
      auth_check_only:
        description: 'Authentication smoke test: exchange the identity token and read the model, nothing else'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Plan only: no credential used, no document fetched, no model called'
        type: boolean
        required: false
        default: true
      open_pull_request:
        description: 'Open a draft data pull request if any claim survives'
        type: boolean
        required: false
        default: false

concurrency:
  group: thesis-pilot
  cancel-in-progress: false

# Read-only at the top, and no `id-token` here: a permission granted at the
# workflow level would reach every job, including the one that can write.
permissions:
  contents: read

jobs:
  extract:
    name: Extract (read-only, holds the key)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A fork cannot reach workflow_dispatch, but saying so costs nothing and
    # survives somebody later adding a trigger that can.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Surojitc/l3vlup-skills'
    permissions:
      contents: read
      # The only job that may ask GitHub who it is.
      id-token: write
    outputs:
      has_claims: ${{ steps.summarise.outputs.has_claims }}
    steps:
      - name: Refuse a contradictory request
        if: ${{ (inputs.dry_run && inputs.open_pull_request) || (inputs.auth_check_only && inputs.open_pull_request) || (inputs.dry_run && inputs.auth_check_only) }}
        run: |
          echo "::error::dry_run, auth_check_only and open_pull_request are mutually exclusive: neither a dry run nor an authentication check produces anything to open a pull request about."
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install
        run: npm ci --omit=optional

      - name: Tests
        run: |
          npm run test:thesis
          npm run test:extraction
          npm run test:pilot
          npm run test:publish
          npm run test:federation
          npm run test:two-stage

      # Every ceiling that matters lives in the code, not in this file, so a
      # workflow edit cannot raise one. This checks they are still there.
      - name: Confirm the ceilings are still in the code
        run: |
          node -e '
            const c = await import("./lib/thesis-cost.mjs");
            const fail = (m) => { console.error(`::error::${m}`); process.exit(1); };
            if (c.LIMITS.hardStopUsd !== 15) fail(`the milestone ceiling is ${c.LIMITS.hardStopUsd}, not 15`);
            if (c.PILOT_BUDGET_USD !== 3) fail(`the pilot budget default is ${c.PILOT_BUDGET_USD}, not 3`);
            if (c.LIMITS.maxDocuments > 9) fail(`the document ceiling is ${c.LIMITS.maxDocuments}`);
            if (c.LIMITS.maxChunksPerDocument > 12) fail(`the chunk ceiling is ${c.LIMITS.maxChunksPerDocument}`);
            if (c.LIMITS.maxOutputTokensPerCall !== 2000) fail(`the per-call output ceiling is ${c.LIMITS.maxOutputTokensPerCall}, not 2000`);
            if (c.LIMITS.maxOutputTokensPerDocument !== 26000) fail(`the per-document output ceiling is ${c.LIMITS.maxOutputTokensPerDocument}, not 26000`);
            if (c.LIMITS.maxInputTokensPerCall !== 40000) fail(`the per-call input ceiling is ${c.LIMITS.maxInputTokensPerCall}, not 40000`);
            if (c.MAX_CANDIDATES_PER_CHUNK !== 2) fail(`the candidate cap is ${c.MAX_CANDIDATES_PER_CHUNK}, not 2`);
            if (c.MAX_CLAIMS_PER_DOCUMENT !== 6) fail(`the claim cap is ${c.MAX_CLAIMS_PER_DOCUMENT}, not 6`);
            if (!c.canCompleteDocument()) fail(`a document at the chunk ceiling cannot be finished within the output budget`);
            if (c.LIMITS.maxModelCalls > 18) fail(`the call ceiling is ${c.LIMITS.maxModelCalls}`);
            if (c.emptyCostLedger({ budgetUsd: 1e6 }).budgetUsd !== 15) fail("a run can raise its own budget past the ceiling");
            console.log("ceilings intact");
          '
          grep -q 'MAX_RETRIES = 0' lib/thesis-anthropic.mjs || { echo "::error::retries are no longer disabled"; exit 1; }
          # A strict tool schema is compiled against a subset that excludes
          # array-size and range constraints. Sending one is a 400 before any
          # inference, which is how run 35501855065 died on its first call, so
          # the request shape is checked here rather than discovered in flight.
          node -e '
            const t = await import("./lib/thesis-anthropic.mjs");
            const banned = ["maxItems", "minItems", "maxLength", "minLength", "minimum", "maximum", "multipleOf", "pattern"];
            for (const [name, tool] of [["propose_candidates", t.CANDIDATE_TOOL], ["select_claims", t.SELECTION_TOOL]]) {
              if (tool.strict !== true) { console.error(`::error::${name} is not strict`); process.exit(1); }
              const json = JSON.stringify(tool.input_schema);
              for (const k of banned) {
                if (json.includes(`"${k}"`)) { console.error(`::error::${name} carries ${k}, which a strict schema rejects`); process.exit(1); }
              }
            }
            console.log("both strict schemas are within the supported subset");
          '
          # Federation is only understood from @anthropic-ai/sdk 0.93.0. An
          # older pin authenticates as nothing at all and the run fails with an
          # error that does not mention federation, so say so here instead.
          node -e '
            const v = require("./node_modules/@anthropic-ai/sdk/package.json").version;
            const [a, b] = v.split(".").map(Number);
            if (a === 0 && b < 93) { console.error(`::error::@anthropic-ai/sdk ${v} predates workload identity federation; 0.93.0 or later is required`); process.exit(1); }
            console.log(`@anthropic-ai/sdk ${v} supports federation`);
          '

      # GitHub mints this token only for a job holding id-token: write, and it
      # expires about five minutes from now. It is written to the runner's
      # private temp directory, never to the checkout, and deleted by the
      # always() cleanup below.
      - name: Ask GitHub who this workflow run is
        if: ${{ !inputs.dry_run }}
        env:
          IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
        run: |
          set -euo pipefail
          umask 077
          curl -sS --fail-with-body \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -er .value > "$IDENTITY_TOKEN_FILE"
          # Report the run's identity, never the token. These are the claims
          # the federation rule matches on, so a denied exchange can be read
          # against the rule without decoding anything secret.
          echo "repository=${GITHUB_REPOSITORY} ref=${GITHUB_REF} event=${GITHUB_EVENT_NAME} workflow_ref=${GITHUB_WORKFLOW_REF}"
          test -s "$IDENTITY_TOKEN_FILE"

      # Inputs reach the script as environment variables and are never spliced
      # into the text of a command. The script validates them again against
      # the approved selection before anything is fetched.
      - name: Dry run
        if: ${{ inputs.dry_run }}
        env:
          DOCUMENT_SET: ${{ inputs.document_set }}
          MODEL: ${{ inputs.model }}
          BUDGET_USD: ${{ inputs.budget_usd }}
        run: node scripts/thesis-pilot.mjs --from-env --dry-run

      # Proves the federated credential works and spends nothing: the exchange
      # happens, the Models API confirms the token is accepted, and the script
      # imports no fetcher and never calls messages.create.
      - name: Authentication check
        if: ${{ !inputs.dry_run && inputs.auth_check_only }}
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          for name in ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN ANTHROPIC_PROFILE; do
            if [ -n "${!name+set}" ]; then
              echo "::error::$name is set for this step; it would shadow the federated credential. Remove it."
              exit 1
            fi
          done
          node scripts/thesis-auth-check.mjs

      - name: Extract
        if: ${{ !inputs.dry_run && !inputs.auth_check_only }}
        env:
          # No key. The SDK reads these four, exchanges the identity token at
          # POST /v1/oauth/token, and holds the resulting access token in
          # memory for the life of the process. None of these four is a
          # secret: they are resource identifiers, and the rule behind them
          # only mints a token for this workflow, on this branch, in this
          # repository, started by hand.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
          DOCUMENT_SET: ${{ inputs.document_set }}
          MODEL: ${{ inputs.model }}
          BUDGET_USD: ${{ inputs.budget_usd }}
          SEC_USER_AGENT: "${{ vars.SEC_USER_AGENT || 'L3VLUP Research (contact: suro@l3vlup.com)' }}"
        run: |
          set -euo pipefail
          # These run here, not in a step of their own, because a step gets only
          # its own env block: a check anywhere else would inspect a different
          # environment from the one node inherits and prove nothing about it.
          #
          # A set ANTHROPIC_API_KEY or ANTHROPIC_AUTH_TOKEN outranks federation
          # in the SDK's credential order, and an empty string still wins its
          # slot, so the run would authenticate as something other than this
          # workflow. ANTHROPIC_PROFILE outranks it too.
          for name in ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN ANTHROPIC_PROFILE; do
            if [ -n "${!name+set}" ]; then
              echo "::error::$name is set for this step; it would shadow the federated credential. Remove it."
              exit 1
            fi
          done
          missing=
          for name in ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::federation is not configured; set these repository variables:$missing"
            exit 1
          fi
          test -s "$ANTHROPIC_IDENTITY_TOKEN_FILE" || { echo "::error::no identity token was fetched"; exit 1; }
          echo "ok: no static credential in this step, federation configured, identity token present"
          node scripts/thesis-pilot.mjs --from-env

      - name: Validate the feed before it can leave the runner
        if: ${{ !inputs.dry_run && !inputs.auth_check_only }}
        run: node scripts/thesis-feed-check.mjs .pilot/feed.json

      - name: Summarise
        id: summarise
        if: ${{ !inputs.dry_run && !inputs.auth_check_only }}
        run: |
          count=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".pilot/feed.json","utf8")).claims.length)')
          echo "has_claims=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          node -e '
            const f = JSON.parse(require("fs").readFileSync(".pilot/feed.json","utf8"));
            const l = [`## Thesis pilot`, "", `- ${f.claims.length} claim(s) awaiting review`,
              `- ${f.refused.length} refused by the publication allowlist`,
              `- ${f.dropped.length} dropped during extraction`,
              `- ${f.stripped.length} field(s) the model tried to decide and may not`,
              `- estimated $${(f.cost.estimatedUsd||0).toFixed(4)}, actual $${(f.cost.actualUsd||0).toFixed(4)} of $${f.cost.budgetUsd}`,
              `- model ${f.model}, prompt ${f.promptVersion}`, "",
              "Every claim is needs_review or issuer_unresolved. Nothing here is accepted or published."];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, l.join("\n") + "\n");
          '

      # Runs whatever happened: a clean finish, a refused fetch, a model that
      # timed out, a cancellation. The script deletes its own workspace; this
      # is the independent check, and it also removes anything the artefact
      # must not carry before the upload step can see it.
      - name: Delete every document, extracted text and identity token
        id: cleanup
        if: always()
        run: |
          status=0
          # The identity token is a bearer credential for about five minutes.
          # It goes first, and its absence is checked rather than assumed.
          rm -f "${RUNNER_TEMP:-/tmp}/anthropic-identity-token"
          if [ -e "${RUNNER_TEMP:-/tmp}/anthropic-identity-token" ]; then
            echo "::error::the identity token survived cleanup"; status=1
          else
            echo "ok: no identity token remains"
          fi
          leftover=$(find "${RUNNER_TEMP:-/tmp}" /tmp -maxdepth 1 -name 'letters-run-*' 2>/dev/null | sort -u)
          if [ -n "$leftover" ]; then
            echo "::error::a run workspace survived:"; echo "$leftover"
            find $leftover -type f 2>/dev/null | head -50
            rm -rf $leftover
            status=1
          else
            echo "ok: no letters-run-* workspace remains"
          fi
          stray=$(git status --porcelain --untracked-files=all 2>/dev/null | awk '{print $NF}' | grep -Ei '[.](pdf|html?|txt|xml)$' || true)
          if [ -n "$stray" ]; then
            echo "::error::the run left document or text files in the checkout:"; echo "$stray"
            status=1
          else
            echo "ok: no document or extracted-text file in the checkout"
          fi
          echo "clean=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit $status

      # A run that dies has already spent money, and the feed upload only runs
      # on success, so until now the runs whose cost mattered most reported
      # nothing. This carries costs and a reason and nothing else, and it waits
      # on the cleanup having actually succeeded: if the workspace or the
      # identity token survived, nothing leaves the runner at all.
      - name: Check the failed run's cost report is safe to upload
        if: ${{ failure() && !inputs.dry_run && !inputs.auth_check_only && steps.cleanup.outputs.clean == 'true' }}
        run: |
          if [ ! -f .pilot/failure.json ]; then
            echo "the run failed before it could record a cost; nothing to upload"
            exit 0
          fi
          node scripts/thesis-failure-check.mjs .pilot/failure.json

      - name: Upload the failed run's cost report
        if: ${{ failure() && !inputs.dry_run && !inputs.auth_check_only && steps.cleanup.outputs.clean == 'true' && hashFiles('.pilot/failure.json') != '' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: thesis-pilot-failure
          path: .pilot/failure.json
          if-no-files-found: error
          retention-days: 1

      # Two artefacts, not one, so the job that can write to this repository
      # never downloads anything but the feed it is going to commit. The review
      # markdown and the cost ledger are for a person to read; splitting them
      # out means the write-capable job has no path to them at all, rather than
      # receiving them and being trusted not to look.
      - name: Upload the sanitised feed
        if: ${{ !inputs.dry_run && !inputs.auth_check_only }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: thesis-pilot-feed
          path: .pilot/feed.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload the review notes for a person
        if: ${{ !inputs.dry_run && !inputs.auth_check_only }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: thesis-pilot-review
          path: |
            .pilot/review.md
            .pilot/cost.json
          if-no-files-found: error
          retention-days: 1

  open-pull-request:
    name: Validate and open a draft data pull request
    needs: extract
    if: ${{ !inputs.dry_run && !inputs.auth_check_only && inputs.open_pull_request && needs.extract.outputs.has_claims == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The least that can open a pull request. No `id-token`, so GitHub does not
    # expose the token request endpoint to this job and it cannot obtain an
    # Anthropic credential even if something in it tried.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install
        run: npm ci --omit=optional

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: thesis-pilot-feed
          path: incoming

      # The artefact is checked again here, by a job that did not watch it
      # being made, before a branch exists.
      - name: Validate what arrived
        run: |
          ls -1 incoming | sort > /tmp/arrived
          printf '%s\n' feed.json > /tmp/expected
          if ! diff -q /tmp/arrived /tmp/expected >/dev/null; then
            echo "::error::the artefact carried something other than the feed:"
            cat /tmp/arrived
            exit 1
          fi
          node scripts/thesis-feed-check.mjs incoming/feed.json

      - name: Open the draft data pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/thesis
          cp incoming/feed.json data/thesis/claims.pending.json
          rm -rf incoming
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage before asking whether anything changed. On the first run the
          # feed is a new, untracked file, and `git diff` does not see one of
          # those: the check would report "nothing to open" and the very first
          # pilot would end without a pull request.
          git add data/thesis/claims.pending.json
          if git diff --cached --quiet; then
            echo "the feed is identical to the one already committed; nothing to open"
            exit 0
          fi
          if ! git diff --cached --quiet -- ':(glob).github/**' ':(glob)*.yml' ':(glob)*.yaml'; then
            echo "::error::the staged change touches a workflow file; refusing"; exit 1
          fi
          branch="thesis/claims-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::$branch already exists on the remote"; exit 1
          fi
          git checkout -b "$branch"
          git commit -m 'Thesis pilot: claims awaiting review'
          git push origin "$branch"
          printf '%s\n' \
            'Claims proposed by the thesis pilot, awaiting review.' \
            '' \
            'Every claim is `needs_review` or `issuer_unresolved`. Nothing here is' \
            'accepted or published, and no workflow can make it so — only a person' \
            'editing this file can move a claim to `accepted` or `edited`.' \
            '' \
            'The feed carries no source text, no prompt and no model response. Read' \
            'the paraphrase, follow the sec.gov link, and check the excerpt against' \
            'the filing before accepting anything.' \
            '' \
            '---' \
            '_Generated by [Claude Code](https://claude.ai/code)_' > /tmp/body.md
          gh pr create --draft --base main --head "$branch" \
            --title 'Thesis pilot: claims awaiting review' --body-file /tmp/body.md
