name: Probe source shapes

# Temporary. Reports the structure of upstream datasets so a parser can be
# written against what is there. Delete once the parser lands.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet openpyxl xlrd
      - run: python3 scripts/probe_damodaran.py
