name: Discover ATS boards

# Resolves lib/sources/careers-seed.json into boards the tracker can poll.
#
# MANUAL ONLY, deliberately. It fetches ~160 firms' own careers pages, which is
# a different kind of request from the daily sync: that one asks a handful of
# ATS APIs for JSON they exist to serve, this one crawls corporate sites that
# have not invited us. Once a firm resolves it moves into the registry and the
# daily sync polls its board instead, so this should run when the seed list
# grows, not on a clock.
#
# Why it exists: the registry is Greenhouse and Ashby, which is what tech
# companies and prop shops use, so the tracker came out 59 software engineering
# roles against 6 investment banking. Banks and funds sit on Workday, Oracle and
# bespoke sites, and have to be found on purpose.

on:
  workflow_dispatch:
    inputs:
      vertical:
        description: 'Restrict to one vertical, e.g. Investment Bank (blank = all)'
        required: false
        default: 'Investment Bank'
      limit:
        description: 'Max firms to attempt (blank = no cap)'
        required: false
        default: '25'
      write:
        description: 'Merge validated boards into the registry and commit'
        type: boolean
        required: false
        default: false
      probe_fields:
        description: 'Report the full field set each ATS returns, instead of resolving boards'
        type: boolean
        required: false
        default: false

# The floor every job here inherits, stated rather than left to a repository
# setting no one reads. Write is granted on the one job that commits, not to
# the file, so a job added later starts from nothing.
permissions:
  contents: read

concurrency:
  group: discover-ats
  cancel-in-progress: false

jobs:
  # It crawls a hundred and sixty corporate careers sites. A token that can
  # only read is the whole point.
  discover:
    name: Discover and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.stage.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20

      # Detection decides what goes into the registry, and a wrong tenant does
      # not error — it returns an empty board that looks like a firm with no
      # early-career roles. Gate the run on the tests.
      - name: Test board detection and the publication contract
        run: |
          node scripts/__tests__/ats-discover.test.mjs
          node scripts/__tests__/publication-contracts.test.mjs
          node scripts/__tests__/publication-freshness.test.mjs
          node scripts/__tests__/workflow-permissions.test.mjs

      # Scaffolding: reports the full field set each ATS returns so enrichment
      # is written against observed payloads. Never fails the run.
      - name: Probe ATS field coverage
        if: inputs.probe_fields
        continue-on-error: true
        run: node scripts/probe-ats-fields.mjs

      - name: Resolve careers pages to boards
        if: ${{ !inputs.probe_fields }}
        # Inputs go through the environment and into a bash array, never into
        # the command line by interpolation. "Investment Bank" contains a space,
        # so an unquoted expansion would hand the script --vertical=Investment
        # and a stray Bank, and it would silently resolve every vertical.
        env:
          VERTICAL: ${{ inputs.vertical }}
          LIMIT: ${{ inputs.limit }}
          WRITE: ${{ inputs.write }}
        run: |
          # if-blocks rather than `[ ... ] && ...`: the runner uses `bash -e`,
          # and a false test on the last line is a non-zero exit for the step.
          ARGS=()
          if [ -n "$VERTICAL" ]; then ARGS+=("--vertical=$VERTICAL"); fi
          if [ -n "$LIMIT" ]; then ARGS+=("--limit=$LIMIT"); fi
          if [ "$WRITE" = "true" ]; then ARGS+=("--write"); fi
          printf 'running: node scripts/discover-ats.mjs %s\n' "${ARGS[*]}"
          node scripts/discover-ats.mjs "${ARGS[@]}"

      # Always, including on a dry run and including when the step above fails,
      # because the report is the deliverable: it names which firms are on an
      # ATS we cannot poll, which is the work someone picks up next.
      #
      # Still on the v4 major while the rest of the file is on the ones that
      # moved to Node 24. Left deliberately: an action tag that does not resolve
      # fails the step outright, which is worse than the deprecation notice it
      # would avoid. If the first run logs the Node 20 notice here, bump it.
      - name: Upload the discovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ats-discovery
          path: data/ats-discovery.json
          if-no-files-found: warn

      - name: Summarise
        if: always()
        run: |
          [ -f data/ats-discovery.json ] || exit 0
          node -e '
            const r = JSON.parse(require("fs").readFileSync("data/ats-discovery.json", "utf8")).results || [];
            const by = {};
            for (const x of r) by[x.status] = (by[x.status] || 0) + 1;
            const L = ["| Outcome | Firms |", "|---|---|"];
            for (const [k, v] of Object.entries(by).sort((a, b) => b[1] - a[1])) L.push(`| ${k} | ${v} |`);
            const ok = r.filter((x) => x.status === "validated");
            if (ok.length) {
              L.push("", "### Validated", "| Firm | Board | Postings |", "|---|---|---|");
              for (const x of ok) L.push(`| ${x.firm} | ${x.board.ats}:${x.board.tenant ?? x.board.token} | ${x.postings} |`);
            }
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, L.join("\n") + "\n");
          '

      # ── publication ────────────────────────────────────────────────────
      # This used to push to main, which the ruleset of 18 September refuses.
      # Unlike collect.yml it at least failed loudly when it did, but a loud
      # failure is not a publication either. It now travels the same road as
      # the other two producers.
      #
      # A dry run writes data/ats-discovery.json and nothing else, and that
      # report is the deliverable of a dry run rather than something to
      # publish; only a `write` run stages anything at all.
      - name: Stage the registry
        id: stage
        if: inputs.write
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new resolved"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --cached --name-only > "$RUNNER_TEMP/staged.txt"
          echo "staged:"
          sed 's/^/  /' "$RUNNER_TEMP/staged.txt"

      - name: Check what is about to be published
        if: steps.stage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node scripts/validate-data-publication.mjs \
            --producer ats-registry \
            --staged "$RUNNER_TEMP/staged.txt"

      # Generated data and nothing else.
      #
      # This step used to copy the gate and the contract table in beside the
      # archive, and the publisher ran those copies. That handed the judge to
      # the party being judged: this job reads a hundred and sixty careers
      # sites, and a collector compromised by one of them could have shipped
      # a gate that approved of whatever else it shipped. The publisher now
      # reads both from its own checkout of `main`, and writes the pull
      # request body there too, so nothing a collector composed describes the
      # change to whoever reviews it.
      - name: Pack what may be published
        if: steps.stage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handoff"
          tar -cf "$RUNNER_TEMP/handoff/publishable.tar" -T "$RUNNER_TEMP/staged.txt"
          echo "the handoff holds:"
          find "$RUNNER_TEMP/handoff" -type f -printf '  %P\n'

      - name: Upload what may be published
        if: steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ats-registry-refresh
          path: ${{ runner.temp }}/handoff
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-data.yml
    with:
      producer: ats-registry
      artifact: ats-registry-refresh
      # Open the data pull request and stop.
      #
      # This is the first producer on the shared publisher and no run of it
      # has ever reached `main` by this road. Opening a pull request is
      # reversible by closing it; merging one is not, and a merge that
      # happens in the same minute as the dispatch leaves nothing to inspect
      # between the two.
      #
      # WHAT WOULD JUSTIFY `true`
      # -------------------------
      # Three runs, in this order, each producing the evidence named:
      #
      #   1. A dry run (`write: false`) whose discover job completes with
      #      `contents: read` and stages nothing. Proves the collecting half
      #      lost its write token without losing its work.
      #   2. A `write: true` run that opens a pull request containing only
      #      lib/sources/ats-registry.json and data/ats-discovery.json, whose
      #      log shows the member check and the gate both running from
      #      `scripts/` and not from the handoff, and whose diff a human has
      #      read and merged by hand.
      #   3. A second `write: true` run against the same branch, proving the
      #      update path replaces rather than stacks.
      #
      # Flip this to `true` only after all three, and only in a pull request
      # that says which run ids they were.
      merge: false
