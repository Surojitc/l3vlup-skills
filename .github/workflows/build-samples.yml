name: Collect and build

# One job for everything that collects: the opportunity tracker from public ATS
# boards, equity and country risk premiums from Damodaran, and the reference
# workbooks built from live SEC filings.
#
# It lives in the public repo because Actions minutes are unlimited here. Nothing
# in it needs a secret, which is the reason it can live here at all — anything
# that touches Supabase, Resend, Firecrawl or a social token stays private.
#
# It doubles as the integration test for the EDGAR client: if a tag list goes
# stale or EDGAR changes shape, this goes red before anyone downloads a broken
# workbook.
#
# The last step is the one exception to "nothing in it needs a secret": once the
# tracker has actually landed on main, it asks the site to work out which
# programme pages changed and tell Bing. See the note above that step for why it
# is safe here, and for why it lives in this workflow rather than a separate
# scheduled one.
#
# HOW THE COLLECTION IS PUBLISHED, AND WHY IT IS NOT A PUSH
# ---------------------------------------------------------
# It used to push to main. A ruleset closed that on 18 September, and every run
# from the 19th failed at the push with GH013 while the collection itself
# succeeded, so the site served a feed that quietly stopped moving. The failure
# mode is the worst kind: green data, red publication, and nothing on the site
# saying so.
#
# The fix is not a bypass. A bypass would have to be granted to an actor, and
# every workflow running as that actor would inherit it, which is a much larger
# hole than the one being filled. Instead the collection now travels the same
# road as every other change: one branch, one pull request, squash merged. That
# is slower by a few seconds and buys a reviewable record of every dataset
# change, which a push never gave.
#
# What makes it safe to merge unattended is the gate in
# scripts/validate-publication.mjs. The run stages everything and the gate
# refuses the lot if a single path falls outside the generated-data allowlist,
# so a run that has somehow edited a script or a workflow publishes nothing at
# all rather than smuggling it in beside the data.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Company-profile tickers (comma separated)'
        required: false
        default: 'AAPL,NVDA'
      comps_target:
        description: 'Comps target ticker'
        required: false
        default: 'NVDA'
      comps_peers:
        description: 'Comps peers (comma separated)'
        required: false
        default: 'AMD,AVGO,MRVL,INTC'
      indexnow_force:
        description: 'Call IndexNow even if the tracker file did not change'
        required: false
        default: 'false'
  schedule:
    # Daily for the tracker, which is the one that actually moves day to day.
    - cron: '30 6 * * *'

# The collection no longer pushes to the default branch: a ruleset closed that
# door on 18 September and the right answer was to travel the same road as
# every other change rather than to be given a way around it. So something in
# this file needs a token that can open a pull request, and the question is
# which part of the run holds it.
#
# Not the part that reads the internet. The collection fetches from ninety-odd
# careers boards and parses whatever comes back, which is the one step here
# where a hostile page gets a say in what a script sees. So the run is two
# jobs. The first collects and holds a read-only token; it cannot push a
# branch, open a pull request or merge one, whatever it reads. It hands the
# second job a tar of the files the gate approved, and only that job holds a
# token that can write. The default below is the floor both inherit from: a
# job that says nothing about permissions gets nothing.
permissions:
  contents: read

concurrency:
  group: build-samples
  cancel-in-progress: false

jobs:
  # Everything that touches the outside world, with a token that can only read.
  collect:
    name: Collect and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      blocking: ${{ steps.freshness.outputs.blocking }}
      degraded: ${{ steps.freshness.outputs.degraded }}
      changed: ${{ steps.stage.outputs.changed }}
      tracker: ${{ steps.stage.outputs.tracker }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Offline checks
        run: python3 tests/run_offline.py

      # The deadline extractor decides what dates reach a public page, so a
      # regression here would put wrong dates on the site rather than merely
      # failing. Cheap to run and it gates the sync below.
      - name: Test the collector's classifiers and pagination
        run: |
          node scripts/__tests__/deadline-extract.test.mjs
          node scripts/__tests__/classify-programme.test.mjs
          node scripts/__tests__/classify-vertical.test.mjs
          node scripts/__tests__/workday-paginate.test.mjs
          node scripts/__tests__/workday-detail.test.mjs
          node scripts/__tests__/deadline-ledger.test.mjs
          node scripts/__tests__/oracle-paginate.test.mjs
          node scripts/__tests__/talnet.test.mjs
          node scripts/__tests__/eightfold-janestreet.test.mjs
          node scripts/__tests__/role-retention.test.mjs
          node scripts/__tests__/role-screen.test.mjs
          node scripts/__tests__/role-duplicates.test.mjs
          node scripts/__tests__/role-telemetry.test.mjs
          node scripts/__tests__/ats-discover.test.mjs
          node scripts/__tests__/slug-registry.test.mjs
          node scripts/__tests__/validate-publication.test.mjs
          node scripts/__tests__/publication-contracts.test.mjs
          node scripts/__tests__/publication-freshness.test.mjs
          node scripts/__tests__/workflow-permissions.test.mjs

      - name: Sync the opportunity tracker from public ATS boards
        # No continue-on-error: the script has its own collapse guard and exits
        # non-zero rather than publishing a shrunken list over good data. Letting
        # that failure be visible is the whole point — a silent 'success' that
        # collated nothing is worse than a red run.
        #
        # This writes three files, not one: the feed, the slug registry that
        # pins each record's URL to its source job id, and the archive of URLs
        # whose roles have left the board. All three are staged and pushed by
        # the existing commit step below, which is what makes them one
        # transaction. There is deliberately no second schedule for any of it.
        run: |
          set -o pipefail
          node scripts/sync-ats.mjs 2>&1 | tee "$RUNNER_TEMP/collector.log"

      - name: Sync the economic backdrop
        continue-on-error: true
        run: python3 scripts/sync_econ.py

      - name: Sync equity and country risk premiums
        continue-on-error: true
        run: python3 scripts/sync_erp.py

      - name: Build company profiles
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'L3VLUP open skills contact@l3vlup.com' }}
        run: |
          set +e
          IFS=',' read -ra T <<< "${{ github.event.inputs.tickers || 'AAPL,NVDA' }}"
          for t in "${T[@]}"; do
            echo "::group::company-profile $t"
            python3 skills/company-profile/build.py "${t// /}" --years 5 --out samples/
            echo "::endgroup::"
          done

      - name: Build comps set
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'L3VLUP open skills contact@l3vlup.com' }}
        run: |
          python3 skills/comps-set-builder/build.py \
            "${{ github.event.inputs.comps_target || 'NVDA' }}" \
            --peers "${{ github.event.inputs.comps_peers || 'AMD,AVGO,MRVL,INTC' }}" \
            --out samples/

      - name: Verify the collected data is intact
        run: |
          python3 - <<'PY'
          import json, sys, datetime
          fails = []
          with open('data/opportunities.auto.json') as f:
              trk = json.load(f)
          roles = len(trk.get('opportunities') or [])
          print(f"tracker: {roles} roles, generated {trk.get('generatedAt')}")
          if roles < 20:
              fails.append(f"tracker collapsed to {roles} roles")
          with open('data/econ.auto.json') as f:
              econ = json.load(f)
          print(f"econ: SOFR {econ['sofr']['rate']}% as at {econ['sofr']['asOf']}, "
                f"{len(econ.get('countries') or [])} countries")
          if not econ.get('sofr', {}).get('rate'):
              fails.append('SOFR missing')
          with open('data/erp.auto.json') as f:
              erp = json.load(f)
          print(f"erp: {len(erp.get('countries') or [])} countries, "
                f"S&P500 implied {erp.get('sp500ImpliedErp')}%")
          if len(erp.get('countries') or []) < 100:
              fails.append('country premium table looks truncated')
          if fails:
              sys.exit('::error::' + '; '.join(fails))
          PY

      - name: Verify something was produced
        run: |
          ls -la samples/ || true
          count=$(ls samples/*.xlsx 2>/dev/null | wc -l)
          echo "workbooks built: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::no workbooks produced — EDGAR fetch or build failed"
            exit 1
          fi

      # ── freshness ──────────────────────────────────────────────────────
      # Every source this producer owns, whether or not this run touched it.
      # The publication gate checks what is being published; a collector that
      # fails every morning publishes nothing, so the gate has nothing to
      # object to while the committed file ages behind a green tick. That is
      # how two days of calendar, deal tape and news map went stale under a
      # run that reported success.
      #
      # It never fails here. Publication goes ahead for the healthy sources
      # first, and the `health` job at the end turns a stale required source
      # into a failed run, so the data still flows and the morning is still
      # visibly not fine.
      - name: Check how fresh every source is
        id: freshness
        run: |
          set -euo pipefail
          node scripts/check-freshness.mjs \
            --producer tracker \
            --summary "$GITHUB_STEP_SUMMARY" \
            --output "$GITHUB_OUTPUT"

      # ── publication ────────────────────────────────────────────────────
      # Everything below replaces a push to main, which a ruleset has refused
      # since 18 September. The shape is deliberate: stage EVERYTHING, then
      # refuse the run if it touched anything outside the generated-data
      # allowlist. `git add data/ samples/` would have left such a change
      # uncommitted and unmentioned; this way a run that has edited a script
      # or a workflow fails loudly and publishes nothing.
      - name: Stage the collection
        id: stage
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "the collection changed nothing; there is nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "tracker=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --cached --name-only > "$RUNNER_TEMP/staged.txt"
          echo "staged:"
          sed 's/^/  /' "$RUNNER_TEMP/staged.txt"
          # Whether the board itself moved, as distinct from a workbook
          # rebuild. Only data/opportunities.auto.json changes what a
          # /tracker/[slug] page renders, so only it is worth telling an
          # engine about, and only once the merge has landed.
          if git diff --cached --name-only | grep -qx 'data/opportunities.auto.json'; then
            echo "tracker=true" >> "$GITHUB_OUTPUT"
          else
            echo "tracker=false" >> "$GITHUB_OUTPUT"
          fi

      # The same gate the publisher runs, run here too so a bad collection
      # fails in the job that produced it rather than in the one that can
      # write. The publisher does not take this run's word for it: it runs
      # the same check again, from its own checkout of `main`, on the staged
      # diff it is actually about to commit.
      #
      # `--producer tracker` rather than the tracker's own CLI, because this
      # producer now travels the same road as the other two and the contract
      # table carries what that CLI held in its head: the two-hundred-row
      # floor, the 0.6x-2.0x band, the required fields, the twenty-four-hour
      # stamp and the per-vertical collapse check. A test runs both against
      # the same feeds and requires the same verdict on every one.
      - name: Check what is about to be published
        if: steps.stage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node scripts/validate-data-publication.mjs \
            --producer tracker \
            --staged "$RUNNER_TEMP/staged.txt"

      # The board result, to the operator reading this run rather than into
      # the pull request. It is this job's account of its own morning and
      # nothing derives it, so it stays on this side of the line: written
      # where it is useful, carried nowhere it could be mistaken for checked.
      - name: Report the board result
        if: always()
        run: |
          set -euo pipefail
          boards=$(grep -oE '[0-9]+/[0-9]+ boards( \([0-9]+ failed\))?' "$RUNNER_TEMP/collector.log" | tail -1 || true)
          {
            echo "### Collector-reported board result"
            echo ""
            echo "\`${boards:-unknown}\` — reported by this job, not measured by the gate."
          } >> "$GITHUB_STEP_SUMMARY"

      # What crosses the line between the two jobs: generated data, and
      # nothing else.
      #
      # This step used to copy the gate in beside the archive, and the
      # publisher ran that copy. The reason given was that a run dispatched
      # from a branch would find a `main` that did not carry the gate yet —
      # which is true, and is the wrong way round. A run dispatched from a
      # branch is exactly the run that must not publish using that branch's
      # gate. This job reads 160 third-party careers pages; letting it choose
      # its own judge put every other control downstream of a file it wrote.
      #
      # The publisher now reads the gate from its own checkout of `main` and
      # writes the pull request body there too, so no prose composed here
      # describes the change to whoever reviews it.
      - name: Pack what may be published
        if: steps.stage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handoff"
          tar -cf "$RUNNER_TEMP/handoff/publishable.tar" -T "$RUNNER_TEMP/staged.txt"
          echo "the handoff holds:"
          find "$RUNNER_TEMP/handoff" -type f -printf '  %P\n'

      - name: Upload what may be published
        if: steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: daily-data-refresh
          path: ${{ runner.temp }}/handoff
          if-no-files-found: error
          retention-days: 3
  # The publication half lives in one file for all three producers, because
  # three copies of it would diverge and each would hold a token that can
  # merge. Granted here, on the one job that says `uses:`, so a reviewer of
  # this workflow sees what the publisher is trusted with; it cannot widen
  # what it inherits.
  #
  # This is the last producer to move, and it was the first to be adapted:
  # it kept its own publisher through the migration precisely because it was
  # the one path to `main` with a proven run behind it. With it gone, exactly
  # one job in the repository can merge.
  publish:
    name: Publish
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-data.yml
    with:
      producer: tracker
      artifact: daily-data-refresh
      # Open the data pull request and stop, on the schedule and by hand
      # alike. A literal, not an expression: this producer has never
      # published through the shared road, and an input is a thing somebody
      # can get wrong at four in the morning.
      #
      # WHAT WOULD JUSTIFY `true`
      # -------------------------
      # Two runs, in this order:
      #
      #   1. A run that opens the data pull request, whose diff carries only
      #      this producer's files and which a human reads and merges.
      #   2. A second run proving the same branch and the same pull request
      #      are updated rather than duplicated.
      #
      # Then a separate, narrow pull request changes this one line and says
      # which two run ids proved it — the same road open-data is on, and for
      # the same reason.
      merge: false

  # Ask the site to work out what changed on the board and tell Bing.
  #
  # WHY IT IS THE JOB AFTER THE MERGE
  # ---------------------------------
  # The site's detector is a change detector: it diffs the published set
  # against the snapshot it recorded last time and posts only the difference.
  # Until the merge lands there is nothing on `main` to recrawl, and calling
  # it before would spend the delta on data the site cannot yet read. The
  # detector reads the feed with `cache: 'no-store'` precisely so that it
  # sees the merge rather than the site's hourly data cache, and its response
  # reports the feed's own generatedAt, so a pass that read a stale copy is
  # visible rather than silent.
  #
  # Gated on the tracker file itself having moved, because only
  # data/opportunities.auto.json changes what a /tracker/[slug] page renders;
  # a workbook rebuild is not news to a search engine.
  #
  # WHILE `merge: false` STANDS, THIS JOB DOES NOT RUN, and that is a real
  # cost stated rather than discovered. The site's own Vercel cron at 20:00
  # UTC is the fallback and is enough on its own: it sits that late because
  # GitHub defers this schedule heavily — across twenty consecutive runs the
  # observed starts ranged from 10:52 to 18:57 UTC — so it clears the tail of
  # that window rather than its median. Recrawl hints arrive on the cron's
  # schedule instead of within minutes of the merge. No page is missed.
  #
  # WHY IT IS SAFE IN A PUBLIC REPOSITORY
  # -------------------------------------
  # `CRON_SECRET` is a repository secret and secrets are never available to a
  # fork. This workflow has no `pull_request` trigger and deliberately no
  # `pull_request_target`, so there is no path by which a pull request, from
  # a fork or otherwise, can run it or read the secret. The secret is never
  # echoed, never interpolated into a command line, and never written to a
  # file that survives the step: curl reads it from a config file in the
  # runner's temporary directory, so it does not reach the process list
  # either. Absent, the step says so and exits clean.
  notify:
    name: Tell the site the tracker moved
    needs: [collect, publish]
    if: |
      github.repository == 'Surojitc/l3vlup-skills' &&
      (
        (needs.publish.outputs.merged == 'true' && needs.collect.outputs.tracker == 'true') ||
        github.event.inputs.indexnow_force == 'true'
      )
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # A recrawl hint is not worth failing a data collection over, and there
      # is nothing downstream of this.
      - name: Call the detector
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is not set in this repository; the site's daily cron covers it."
            exit 0
          fi

          conf="$(mktemp)"
          trap 'rm -f "$conf"' EXIT
          printf 'header = "Authorization: Bearer %s"\n' "$CRON_SECRET" > "$conf"

          code=$(curl -sS --config "$conf" \
            -o response.json -w '%{http_code}' \
            --max-time 120 --retry 2 --retry-connrefused \
            -X POST 'https://www.l3vlup.com/api/cron/indexnow') || code=000

          echo "the detector answered HTTP $code"
          # Counts and the feed timestamp. No secret and no personal data.
          head -c 600 response.json || true
          echo

          case "$code" in
            200) echo "::notice::IndexNow pass complete" ;;
            401) echo "::error::CRON_SECRET here does not match the site's" ;;
            503) echo "::error::the site has no IndexNow state store; run supabase/indexnow.sql" ;;
            *)   echo "::warning::unexpected response $code; the site's 20:00 cron will retry" ;;
          esac


  # The run's conclusion, set after publication rather than before it.
  #
  # Two requirements pull against each other: a stale calendar must not stop a
  # healthy deal tape reaching the site, and a morning where a collector has
  # been dead for two days must not report success. So publication happens,
  # and then this fails the run and says which source and since when.
  #
  # `if: always()` because the interesting case is the one where publishing
  # was skipped or failed: a health report that only runs on the happy path is
  # the defect it was written to catch.
  health:
    name: Source health
    needs: [collect, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Three outcomes, and the first of them is the one this job used to get
      # wrong. `blocking` and `degraded` arrive from a step in the collecting
      # job; if that job died before reaching it, both are empty strings, and
      # empty is not false. The old wording read them as an all-clear and
      # printed "every required source is within its horizon" over a
      # collection that never happened. The worst case is not a job that
      # never started but one whose sweep ran and whose later step — the
      # staging, the gate, the upload — failed: both outputs say everything
      # is fine, because on that morning's data it was, and nothing was
      # published all the same.
      #
      # Word for word what collect.yml says, because an operator reading two
      # morning emails should not have to learn two vocabularies.
      - name: Say what this morning actually was
        env:
          COLLECT: ${{ needs.collect.result }}
          PUBLISH: ${{ needs.publish.result }}
          BLOCKING: ${{ needs.collect.outputs.blocking }}
          DEGRADED: ${{ needs.collect.outputs.degraded }}
        run: |
          set -euo pipefail

          # 1. The collection or the publication did not finish. Freshness
          #    cannot be established either way, and saying so is the whole
          #    job: `skipped` on publish is the legitimate case where the
          #    collection changed nothing.
          if [ "${COLLECT:-}" != "success" ]; then
            echo "::error::the collection did not finish (${COLLECT:-unknown}); freshness could not establish an all-clear, and nothing was published"
            exit 1
          fi
          if [ "${PUBLISH:-}" != "success" ] && [ "${PUBLISH:-}" != "skipped" ]; then
            echo "::error::the collection finished but publication did not (${PUBLISH:-unknown}); freshness could not establish an all-clear for what reached main"
            exit 1
          fi

          # 2. The collection finished and a required source is stale.
          if [ "${BLOCKING:-}" = "true" ]; then
            echo "::error::the collection finished, and a required source has not been collected inside its horizon; see the freshness table in this run's summary"
            exit 1
          fi

          # A verdict the sweep never wrote is not a verdict. If the
          # collecting job succeeded, both of these are set.
          if [ -z "${BLOCKING:-}" ]; then
            echo "::error::the collection reported success but wrote no freshness verdict; freshness could not establish an all-clear"
            exit 1
          fi

          # 3. The collection finished and every required source is fresh.
          if [ "${DEGRADED:-}" = "true" ]; then
            echo "::warning::an optional source is degraded; publication went ahead"
          fi
          echo "the collection finished and every required source is within its horizon"
