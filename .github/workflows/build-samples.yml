name: Collect and build

# One job for everything that collects: the opportunity tracker from public ATS
# boards, equity and country risk premiums from Damodaran, and the reference
# workbooks built from live SEC filings.
#
# It lives in the public repo because Actions minutes are unlimited here. Nothing
# in it needs a secret, which is the reason it can live here at all — anything
# that touches Supabase, Resend, Firecrawl or a social token stays private.
#
# It doubles as the integration test for the EDGAR client: if a tag list goes
# stale or EDGAR changes shape, this goes red before anyone downloads a broken
# workbook.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Company-profile tickers (comma separated)'
        required: false
        default: 'AAPL,NVDA'
      comps_target:
        description: 'Comps target ticker'
        required: false
        default: 'NVDA'
      comps_peers:
        description: 'Comps peers (comma separated)'
        required: false
        default: 'AMD,AVGO,MRVL,INTC'
  schedule:
    # Daily for the tracker, which is the one that actually moves day to day.
    - cron: '30 6 * * *'

permissions:
  contents: write

concurrency:
  group: build-samples
  cancel-in-progress: false

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Offline checks
        run: python3 tests/run_offline.py

      # The deadline extractor decides what dates reach a public page, so a
      # regression here would put wrong dates on the site rather than merely
      # failing. Cheap to run and it gates the sync below.
      - name: Test the collector's classifiers and pagination
        run: |
          node scripts/__tests__/deadline-extract.test.mjs
          node scripts/__tests__/classify-programme.test.mjs
          node scripts/__tests__/classify-vertical.test.mjs
          node scripts/__tests__/workday-paginate.test.mjs
          node scripts/__tests__/workday-detail.test.mjs
          node scripts/__tests__/deadline-ledger.test.mjs
          node scripts/__tests__/oracle-paginate.test.mjs
          node scripts/__tests__/talnet.test.mjs
          node scripts/__tests__/eightfold-janestreet.test.mjs
          node scripts/__tests__/ats-discover.test.mjs

      - name: Sync the opportunity tracker from public ATS boards
        # No continue-on-error: the script has its own collapse guard and exits
        # non-zero rather than publishing a shrunken list over good data. Letting
        # that failure be visible is the whole point — a silent 'success' that
        # collated nothing is worse than a red run.
        run: node scripts/sync-ats.mjs

      - name: Sync the economic backdrop
        continue-on-error: true
        run: python3 scripts/sync_econ.py

      - name: Sync equity and country risk premiums
        continue-on-error: true
        run: python3 scripts/sync_erp.py

      - name: Build company profiles
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'L3VLUP open skills contact@l3vlup.com' }}
        run: |
          set +e
          IFS=',' read -ra T <<< "${{ github.event.inputs.tickers || 'AAPL,NVDA' }}"
          for t in "${T[@]}"; do
            echo "::group::company-profile $t"
            python3 skills/company-profile/build.py "${t// /}" --years 5 --out samples/
            echo "::endgroup::"
          done

      - name: Build comps set
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'L3VLUP open skills contact@l3vlup.com' }}
        run: |
          python3 skills/comps-set-builder/build.py \
            "${{ github.event.inputs.comps_target || 'NVDA' }}" \
            --peers "${{ github.event.inputs.comps_peers || 'AMD,AVGO,MRVL,INTC' }}" \
            --out samples/

      - name: Verify the collected data is intact
        run: |
          python3 - <<'PY'
          import json, sys, datetime
          fails = []
          with open('data/opportunities.auto.json') as f:
              trk = json.load(f)
          roles = len(trk.get('opportunities') or [])
          print(f"tracker: {roles} roles, generated {trk.get('generatedAt')}")
          if roles < 20:
              fails.append(f"tracker collapsed to {roles} roles")
          with open('data/econ.auto.json') as f:
              econ = json.load(f)
          print(f"econ: SOFR {econ['sofr']['rate']}% as at {econ['sofr']['asOf']}, "
                f"{len(econ.get('countries') or [])} countries")
          if not econ.get('sofr', {}).get('rate'):
              fails.append('SOFR missing')
          with open('data/erp.auto.json') as f:
              erp = json.load(f)
          print(f"erp: {len(erp.get('countries') or [])} countries, "
                f"S&P500 implied {erp.get('sp500ImpliedErp')}%")
          if len(erp.get('countries') or []) < 100:
              fails.append('country premium table looks truncated')
          if fails:
              sys.exit('::error::' + '; '.join(fails))
          PY

      - name: Verify something was produced
        run: |
          ls -la samples/ || true
          count=$(ls samples/*.xlsx 2>/dev/null | wc -l)
          echo "workbooks built: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::no workbooks produced — EDGAR fetch or build failed"
            exit 1
          fi

      - name: Commit samples
        run: |
          git config user.name  "l3vlup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add samples/ data/ || true
          if git diff --cached --quiet; then
            echo "no sample changes"
            exit 0
          fi
          git commit -m "chore(data): daily collection [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push failed, rebasing (attempt $i)"
            git pull --rebase origin main || true
            sleep $((2 ** i))
          done
          echo "::error::could not push samples"
          exit 1
